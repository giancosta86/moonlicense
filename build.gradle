buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'java'
apply plugin: 'maven'
apply plugin: 'osgi'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.moonlicense'
archivesBaseName = 'moonlicense'
version = '4.0.0-SNAPSHOT'

description = 'Language-independent Java library for setting/removing license notices'

sourceCompatibility = '1.8'

dependencies {
    testCompile 'junit:junit:4.11'
}

aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
    }
}
